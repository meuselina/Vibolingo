<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg: #FFF7ED; --surface: #FFFFFF; --ink: #241B3A; --ink-soft: #9186AC;
      --violet: #7C4DFF; --violet-deep: #5A22D6; --violet-pale: #F1EAFF;
      --coral: #FF5C7A; --coral-deep: #E23C5C; --coral-pale: #FFE4EA;
      --gold: #FFB020; --gold-deep: #E08E00; --gold-pale: #FFF1D2;
      --green: #2FBE84; --green-pale: #DCF7EA; --line: #EDE4FF; --lock: #D9D2E8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink); }
    a { color: var(--violet); } a:hover { color: var(--violet-deep); }
    .screen { width: 390px; height: 844px; background: var(--bg); border-radius: 40px; border: 1px solid rgba(36,27,58,0.08); overflow: hidden; position: relative; display: flex; flex-direction: column; }
  </style>
</helmet>

<div class="screen">

  <!-- top status bar -->
  <div style="flex:none; padding: 26px 20px 14px; display:flex; align-items:center; justify-content:space-between;">
    <svg width="30" height="30" viewBox="0 0 200 200" fill="none"><path d="M100 30C58 30 40 66 40 100c0 40 27 62 60 62s60-22 60-62c0-34-18-70-60-70Z" fill="var(--violet)"/><ellipse cx="72" cy="100" rx="9" ry="11" fill="#fff"/><ellipse cx="128" cy="100" rx="9" ry="11" fill="#fff"/></svg>
    <div style="display:flex; gap:8px;">
      <div style="display:flex; align-items:center; gap:5px; background:var(--surface); border-radius:999px; padding:6px 12px; box-shadow: 0 2px 0 var(--line);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2c3 3.5 5 6.6 5 9.5A5 5 0 0 1 7 11.5C7 8.6 9 5.5 12 2Z" fill="var(--gold)"/></svg>
        <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--gold-deep);">14</span>
      </div>
      <div style="display:flex; align-items:center; gap:5px; background:var(--surface); border-radius:999px; padding:6px 12px; box-shadow: 0 2px 0 var(--line);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 2 3 9l9 13 9-13-9-7Z" fill="var(--violet)"/></svg>
        <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--violet);">860</span>
      </div>
      <div style="display:flex; align-items:center; gap:5px; background:var(--surface); border-radius:999px; padding:6px 12px; box-shadow: 0 2px 0 var(--line);">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 20.5S3.5 14.9 3.5 8.8C3.5 5.6 6 3.5 8.7 3.5c1.6 0 3.1.8 3.3 2 0.2-1.2 1.7-2 3.3-2C18 3.5 20.5 5.6 20.5 8.8c0 6.1-8.5 11.7-8.5 11.7Z" fill="var(--coral)"/></svg>
        <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--coral-deep);">5</span>
      </div>
    </div>
  </div>

  <!-- scrollable path -->
  <div style="flex:1; overflow:hidden; position:relative;">

    <!-- unit banner -->
    <div style="margin: 4px 20px 0; background: var(--violet); border-radius:20px; padding:16px 20px; display:flex; align-items:center; justify-content:space-between; box-shadow: 0 4px 0 var(--violet-deep);">
      <div>
        <div style="font-size:11px; font-weight:800; letter-spacing:0.1em; color:#D8C6FF;">UNIT 2</div>
        <div style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:17px; color:#fff; margin-top:2px;">Prompting Like a Pro</div>
      </div>
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="#fff" stroke-width="2"/><path d="M9 9h6M9 13h4" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </div>

    <!-- path nodes -->
    <div style="position:relative; margin-top: 26px; padding-bottom: 40px; height: 500px;">
      <svg width="390" height="500" style="position:absolute; top:0; left:0;" viewBox="0 0 390 500" fill="none">
        <polyline points="195,32 130,132 195,232 260,332 195,432" stroke="var(--line)" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 16"/>
      </svg>

      <!-- node 1: completed -->
      <div style="position:absolute; left:171px; top:8px; width:48px; height:48px; border-radius:50%; background:var(--gold); box-shadow:0 5px 0 var(--gold-deep); display:flex; align-items:center; justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <!-- node 2: completed -->
      <div style="position:absolute; left:106px; top:108px; width:48px; height:48px; border-radius:50%; background:var(--gold); box-shadow:0 5px 0 var(--gold-deep); display:flex; align-items:center; justify-content:center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-10" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <!-- node 3: active -->
      <div style="position:absolute; left:159px; top:196px; width:72px; height:72px;">
        <div style="position:absolute; inset:0; border-radius:50%; border:3px dashed var(--violet); opacity:0.5;"></div>
        <div style="position:absolute; inset:8px; border-radius:50%; background:var(--violet); box-shadow:0 6px 0 var(--violet-deep); display:flex; align-items:center; justify-content:center;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2 3 9l9 13 9-13-9-7Z" fill="#fff"/></svg>
        </div>
        <div style="position:absolute; left:50%; top:100%; transform:translateX(-50%); margin-top:10px; background:#fff; border-radius:999px; padding:5px 16px; font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:var(--violet); box-shadow:0 3px 0 var(--line); white-space:nowrap;">START</div>
      </div>

      <!-- mascot, clear of node 4 -->
      <div style="position:absolute; left:296px; top:150px; width:84px; text-align:center;">
        <svg width="60" height="60" viewBox="0 0 200 200" fill="none" style="margin:0 auto; display:block;">
          <path d="M100 22C48 22 26 66 26 108c0 50 34 76 74 76s74-26 74-76C174 66 152 22 100 22Z" fill="#fff" stroke="var(--line)" stroke-width="2"/>
          <circle cx="55" cy="146" r="10" fill="var(--coral-pale)"/><circle cx="145" cy="146" r="10" fill="var(--coral-pale)"/>
          <path d="M38 96C38 48 162 48 162 96" stroke="var(--coral)" stroke-width="11" fill="none" stroke-linecap="round"/>
          <rect x="21" y="86" width="28" height="42" rx="14" fill="var(--coral)"/><rect x="151" y="86" width="28" height="42" rx="14" fill="var(--coral)"/>
          <ellipse cx="74" cy="112" rx="16" ry="20" fill="var(--ink)"/><ellipse cx="126" cy="112" rx="16" ry="20" fill="var(--ink)"/>
          <circle cx="79" cy="106" r="5" fill="#fff"/><circle cx="131" cy="106" r="5" fill="#fff"/>
          <path d="M80 148c8 9 32 9 40 0" stroke="var(--ink)" stroke-width="6" fill="none" stroke-linecap="round"/>
        </svg>
        <div style="margin-top:6px; background:var(--ink); color:#fff; font-size:11px; font-weight:600; padding:6px 4px; border-radius:12px; white-space:nowrap;">Let's build!</div>
      </div>

      <!-- node 4: locked -->
      <div style="position:absolute; left:236px; top:308px; width:48px; height:48px; border-radius:50%; background:var(--lock); box-shadow:0 5px 0 #C4BBDA; display:flex; align-items:center; justify-content:center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="2" stroke="#fff" stroke-width="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#fff" stroke-width="2"/></svg>
      </div>

      <!-- node 5: locked, chest reward -->
      <div style="position:absolute; left:171px; top:408px; width:48px; height:48px; border-radius:16px; background:var(--lock); box-shadow:0 5px 0 #C4BBDA; display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="9" width="16" height="10" rx="2" stroke="#fff" stroke-width="2"/><path d="M4 9h16M12 9v10" stroke="#fff" stroke-width="2"/></svg>
      </div>

    </div>
  </div>

  <!-- bottom nav -->
  <div style="flex:none; display:flex; align-items:center; justify-content:space-around; padding: 12px 12px 20px; background:var(--surface); border-top:1px solid var(--line);">
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M3 11l9-7 9 7" stroke="var(--violet)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v9h14v-9" stroke="var(--violet)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div style="width:5px; height:5px; border-radius:50%; background:var(--violet);"></div>
    </div>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" stroke="var(--ink-soft)" stroke-width="2.2" stroke-linejoin="round"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4Z" stroke="var(--ink-soft)" stroke-width="2.1" stroke-linejoin="round"/><path d="M7 5H4.5A2.5 2.5 0 0 0 7 9M17 5h2.5A2.5 2.5 0 0 1 17 9" stroke="var(--ink-soft)" stroke-width="2.1" stroke-linecap="round"/><path d="M12 12v3.5M9.5 19.5h5M10 16.5h4v3h-4z" stroke="var(--ink-soft)" stroke-width="2.1" stroke-linejoin="round"/></svg>
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="var(--ink-soft)" stroke-width="2.2"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6" stroke="var(--ink-soft)" stroke-width="2.2" stroke-linecap="round"/></svg>
  </div>

</div>
</x-dc>
</body>
</html>
