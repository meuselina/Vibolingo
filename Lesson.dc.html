<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg: #FFF7ED; --surface: #FFFFFF; --ink: #241B3A; --ink-soft: #9186AC;
      --violet: #7C4DFF; --violet-deep: #5A22D6; --violet-pale: #F1EAFF;
      --coral: #FF5C7A; --coral-deep: #E23C5C; --coral-pale: #FFE4EA;
      --gold: #FFB020; --gold-deep: #E08E00; --gold-pale: #FFF1D2;
      --green: #2FBE84; --green-pale: #DCF7EA; --line: #EDE4FF;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink); }
    .screen { width: 390px; height: 844px; background: var(--bg); border-radius: 40px; border: 1px solid rgba(36,27,58,0.08); overflow: hidden; position: relative; display: flex; flex-direction: column; }
  </style>
</helmet>

<div class="screen">

  <!-- top bar -->
  <div style="flex:none; padding: 24px 20px 14px; display:flex; align-items:center; gap:14px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="var(--ink-soft)" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div style="flex:1; height:14px; background:var(--line); border-radius:999px; overflow:hidden;">
      <div style="width:58%; height:100%; background:var(--green); border-radius:999px;"></div>
    </div>
    <div style="display:flex; align-items:center; gap:4px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 20.5S3.5 14.9 3.5 8.8C3.5 5.6 6 3.5 8.7 3.5c1.6 0 3.1.8 3.3 2 0.2-1.2 1.7-2 3.3-2C18 3.5 20.5 5.6 20.5 8.8c0 6.1-8.5 11.7-8.5 11.7Z" fill="var(--coral)"/></svg>
      <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--coral-deep);">5</span>
    </div>
  </div>

  <!-- lesson goal -->
  <div style="flex:none; margin: 4px 20px 0; display:flex; align-items:center; gap:8px; background:var(--violet-pale); border-radius:14px; padding:10px 14px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="var(--violet)" stroke-width="2"/><circle cx="12" cy="12" r="3.4" fill="var(--violet)"/></svg>
    <span style="font-size:13.5px; font-weight:700; color:var(--violet-deep);">Build: a tip calculator</span>
  </div>

  <!-- chat + preview -->
  <div style="flex:1; overflow:hidden; padding: 16px 20px 0; display:flex; flex-direction:column; gap:12px;">

    <!-- ai bubble -->
    <div style="display:flex; gap:10px; align-items:flex-end;">
      <svg width="30" height="30" viewBox="0 0 200 200" fill="none" style="flex:none;">
        <path d="M100 22C48 22 26 66 26 108c0 50 34 76 74 76s74-26 74-76C174 66 152 22 100 22Z" fill="var(--violet)"/>
        <ellipse cx="74" cy="112" rx="16" ry="20" fill="#fff"/><ellipse cx="126" cy="112" rx="16" ry="20" fill="#fff"/>
        <circle cx="79" cy="108" r="6" fill="var(--ink)"/><circle cx="131" cy="108" r="6" fill="var(--ink)"/>
      </svg>
      <div style="background:var(--surface); border-radius:16px 16px 16px 4px; padding:10px 14px; font-size:13.5px; line-height:1.5; max-width:240px; box-shadow:0 2px 0 var(--line);">Here's your starting app. Try changing something.</div>
    </div>

    <!-- user bubble -->
    <div style="display:flex; justify-content:flex-end;">
      <div style="background:var(--violet); color:#fff; border-radius:16px 16px 4px 16px; padding:10px 14px; font-size:13.5px; line-height:1.5; max-width:230px;">Make the total bigger and use my brand purple</div>
    </div>

    <!-- live preview -->
    <div style="margin-top:2px; flex:1; display:flex; flex-direction:column; min-height:0;">
      <div style="font-size:11px; font-weight:800; letter-spacing:0.08em; color:var(--ink-soft); margin-bottom:8px;">LIVE PREVIEW</div>
      <div style="flex:1; background:var(--surface); border-radius:20px; border:1px solid var(--line); padding:20px; display:flex; flex-direction:column; gap:14px;">
        <div style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:16px;">Tip Calculator</div>
        <div style="background:var(--bg); border-radius:12px; padding:12px 14px; font-size:14px; color:var(--ink-soft);">Bill amount &nbsp; <span style="color:var(--ink); font-weight:700;">$42.00</span></div>
        <div style="display:flex; gap:8px;">
          <div style="flex:1; text-align:center; background:var(--bg); border-radius:999px; padding:8px 0; font-size:13px; font-weight:700; color:var(--ink-soft);">15%</div>
          <div style="flex:1; text-align:center; background:var(--violet); border-radius:999px; padding:8px 0; font-size:13px; font-weight:700; color:#fff;">18%</div>
          <div style="flex:1; text-align:center; background:var(--bg); border-radius:999px; padding:8px 0; font-size:13px; font-weight:700; color:var(--ink-soft);">20%</div>
        </div>
        <div style="margin-top:auto; text-align:center;">
          <div style="font-size:12px; color:var(--ink-soft); font-weight:600;">TOTAL</div>
          <div style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:34px; color:var(--violet);">$49.56</div>
        </div>
      </div>
    </div>
  </div>

  <!-- prompt input -->
  <div style="flex:none; padding: 14px 20px 24px; display:flex; align-items:center; gap:10px;">
    <div style="flex:1; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:14px 18px; font-size:13.5px; color:var(--ink-soft);">Tell the AI what to change&hellip;</div>
    <div style="width:48px; height:48px; border-radius:50%; background:var(--gold); box-shadow:0 4px 0 var(--gold-deep); display:flex; align-items:center; justify-content:center; flex:none;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 12l16-7-6 16-3-6-7-3Z" stroke="#4A2E00" stroke-width="2" stroke-linejoin="round"/></svg>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
