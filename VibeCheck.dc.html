<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg: #FFF7ED; --surface: #FFFFFF; --ink: #241B3A; --ink-soft: #9186AC;
      --violet: #7C4DFF; --violet-deep: #5A22D6; --violet-pale: #F1EAFF;
      --coral: #FF5C7A; --coral-deep: #E23C5C; --coral-pale: #FFE4EA;
      --gold: #FFB020; --gold-deep: #E08E00; --gold-pale: #FFF1D2;
      --green: #2FBE84; --green-deep: #1E9C68; --green-pale: #DCF7EA; --line: #EDE4FF;
      --code-bg: #2B2140;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink); }
    .screen { width: 390px; height: 844px; background: var(--bg); border-radius: 40px; border: 1px solid rgba(36,27,58,0.08); overflow: hidden; position: relative; display: flex; flex-direction: column; }
    .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
  </style>
</helmet>

<div class="screen">

  <!-- top bar -->
  <div style="flex:none; padding: 24px 20px 14px; display:flex; align-items:center; gap:14px;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="var(--ink-soft)" stroke-width="2.4" stroke-linecap="round"/></svg>
    <div style="flex:1; height:14px; background:var(--line); border-radius:999px; overflow:hidden;">
      <div style="width:30%; height:100%; background:var(--green); border-radius:999px;"></div>
    </div>
    <div style="display:flex; align-items:center; gap:4px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 20.5S3.5 14.9 3.5 8.8C3.5 5.6 6 3.5 8.7 3.5c1.6 0 3.1.8 3.3 2 0.2-1.2 1.7-2 3.3-2C18 3.5 20.5 5.6 20.5 8.8c0 6.1-8.5 11.7-8.5 11.7Z" fill="var(--coral)"/></svg>
      <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--coral-deep);">4</span>
    </div>
  </div>

  <div style="flex:1; padding: 18px 24px 0; display:flex; flex-direction:column;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:38px; height:38px; border-radius:12px; background:var(--gold-pale); display:flex; align-items:center; justify-content:center; flex:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" stroke="var(--gold-deep)" stroke-width="2" stroke-linejoin="round"/></svg>
      </div>
      <div>
        <h1 style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:22px; margin:0;">Vibe Check</h1>
        <div style="font-size:13px; color:var(--ink-soft); font-weight:600;">Would you ship this?</div>
      </div>
    </div>

    <!-- code card -->
    <div class="mono" style="margin-top:22px; background:var(--code-bg); border-radius:18px; padding:18px; font-size:12.5px; line-height:1.9; color:#D8C6FF; box-shadow:0 4px 0 #1C1530;">
      <div style="display:flex; gap:14px;"><span style="color:#9384B8; width:10px;">1</span><span>async function login(pw) {</span></div>
      <div style="display:flex; gap:14px;"><span style="color:#9384B8; width:10px;">2</span><span style="padding-left:16px;">const res = await fetch(url, {</span></div>
      <div style="display:flex; gap:14px;"><span style="color:#9384B8; width:10px;">3</span><span style="padding-left:32px;">method: 'POST',</span></div>
      <div style="display:flex; gap:14px; background:rgba(255,92,122,0.22); border-radius:6px; margin: 0 -8px; padding: 0 8px;"><span style="color:var(--coral); width:10px;">4</span><span style="padding-left:32px;">key: 'sk_live_51H8a9F2x&hellip;',</span></div>
      <div style="display:flex; gap:14px;"><span style="color:#9384B8; width:10px;">5</span><span style="padding-left:16px;">});</span></div>
      <div style="display:flex; gap:14px;"><span style="color:#9384B8; width:10px;">6</span><span style="padding-left:16px;">return res.json();</span></div>
      <div style="display:flex; gap:14px;"><span style="color:#9384B8; width:10px;">7</span><span>}</span></div>
    </div>
    <div style="display:flex; align-items:flex-start; gap:8px; margin-top:14px; background:var(--coral-pale); border-radius:14px; padding:12px 14px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="flex:none; margin-top:1px;"><path d="M12 9v4M12 17h.01" stroke="var(--coral-deep)" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="var(--coral-deep)" stroke-width="2"/></svg>
      <p style="font-size:13px; color:var(--coral-deep); line-height:1.5; margin:0;">Line 4 hard-codes a live API key right into the request.</p>
    </div>

    <!-- answer buttons -->
    <div style="margin-top:auto; padding-bottom:28px; display:flex; gap:14px;">
      <button style="flex:1; height:60px; border:none; border-radius:20px; background:var(--green-pale); box-shadow:0 4px 0 #BEEBD3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4 10-10" stroke="var(--green-deep)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:var(--green-deep);">Ship it</span>
      </button>
      <button style="flex:1; height:60px; border:none; border-radius:20px; background:var(--coral); box-shadow:0 4px 0 var(--coral-deep); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M6 3v18M6 4h11l-3 4 3 4H6" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/></svg>
        <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:#fff;">Flag it</span>
      </button>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
