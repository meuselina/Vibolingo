<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    :root {
      --bg: #FFF7ED; --surface: #FFFFFF; --ink: #241B3A; --ink-soft: #9186AC;
      --violet: #7C4DFF; --violet-deep: #5A22D6; --violet-pale: #F1EAFF;
      --coral: #FF5C7A; --coral-deep: #E23C5C; --coral-pale: #FFE4EA;
      --gold: #FFB020; --gold-deep: #E08E00; --gold-pale: #FFF1D2;
      --green: #2FBE84; --green-deep:#1E9C68; --green-pale: #DCF7EA; --line: #EDE4FF;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: var(--ink); }
    .screen { width: 390px; height: 844px; background: var(--bg); border-radius: 40px; border: 1px solid rgba(36,27,58,0.08); overflow: hidden; position: relative; display: flex; flex-direction: column; }
    .row { display:flex; align-items:center; }
  </style>
</helmet>

<div class="screen">

  <div style="flex:none; padding: 26px 24px 0;">
    <h1 style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:22px;">Your streak</h1>
  </div>

  <!-- streak flame -->
  <div style="flex:none; margin: 16px 24px 0; background:var(--violet); border-radius:24px; padding:26px; text-align:center; box-shadow:0 5px 0 var(--violet-deep);">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" style="margin:0 auto;"><path d="M12 2c3 3.5 5 6.6 5 9.5A5 5 0 0 1 7 11.5C7 8.6 9 5.5 12 2Z" fill="var(--gold)"/></svg>
    <div style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:40px; color:#fff; margin-top:6px;">14</div>
    <div style="font-size:13px; font-weight:700; color:#D8C6FF; letter-spacing:0.04em;">DAY STREAK</div>
    <div class="row" style="justify-content:center; gap:8px; margin-top:18px;">
      <div style="width:30px; height:30px; border-radius:9px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#4A2E00;">M</div>
      <div style="width:30px; height:30px; border-radius:9px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#4A2E00;">T</div>
      <div style="width:30px; height:30px; border-radius:9px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#4A2E00;">W</div>
      <div style="width:30px; height:30px; border-radius:9px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#4A2E00;">T</div>
      <div style="width:30px; height:30px; border-radius:9px; background:var(--gold); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#4A2E00;">F</div>
      <div style="width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff;">S</div>
      <div style="width:30px; height:30px; border-radius:9px; background:rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; color:#fff;">S</div>
    </div>
  </div>

  <!-- league header -->
  <div class="row" style="flex:none; margin: 24px 24px 0; justify-content:space-between;">
    <div class="row" style="gap:10px;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M12 2 4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4Z" fill="var(--gold)"/></svg>
      <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:17px;">Diamond League</span>
    </div>
    <span style="font-size:12.5px; color:var(--ink-soft); font-weight:700;">2 days left</span>
  </div>

  <!-- leaderboard -->
  <div style="flex:1; overflow:hidden; margin: 12px 24px 0; display:flex; flex-direction:column; gap:8px;">

    <div class="row" style="gap:12px; background:var(--surface); border-radius:16px; padding:10px 14px; border:1px solid var(--line);">
      <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--ink-soft); width:18px;">1</span>
      <div style="width:34px; height:34px; border-radius:50%; background:var(--gold-pale); display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:var(--gold-deep);">JR</div>
      <span style="flex:1; font-size:14px; font-weight:700;">Jordan</span>
      <span style="font-size:13px; color:var(--ink-soft); font-weight:700;">612 XP</span>
    </div>

    <div class="row" style="gap:12px; background:var(--surface); border-radius:16px; padding:10px 14px; border:1px solid var(--line);">
      <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--ink-soft); width:18px;">2</span>
      <div style="width:34px; height:34px; border-radius:50%; background:var(--coral-pale); display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:var(--coral-deep);">PR</div>
      <span style="flex:1; font-size:14px; font-weight:700;">Priya</span>
      <span style="font-size:13px; color:var(--ink-soft); font-weight:700;">588 XP</span>
    </div>

    <div class="row" style="gap:12px; background:var(--violet-pale); border-radius:16px; padding:10px 14px; border:2px solid var(--violet);">
      <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--violet); width:18px;">3</span>
      <div style="width:34px; height:34px; border-radius:50%; background:var(--violet); display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:#fff;">YOU</div>
      <span style="flex:1; font-size:14px; font-weight:800; color:var(--violet-deep);">You</span>
      <span style="font-size:13px; color:var(--violet-deep); font-weight:800;">540 XP</span>
    </div>

    <div class="row" style="gap:12px; background:var(--surface); border-radius:16px; padding:10px 14px; border:1px solid var(--line);">
      <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--ink-soft); width:18px;">4</span>
      <div style="width:34px; height:34px; border-radius:50%; background:var(--green-pale); display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:var(--green-deep);">SM</div>
      <span style="flex:1; font-size:14px; font-weight:700;">Sam</span>
      <span style="font-size:13px; color:var(--ink-soft); font-weight:700;">501 XP</span>
    </div>

    <div style="height:1px; background:var(--line); margin: 2px 4px;"></div>

    <div class="row" style="gap:12px; background:var(--surface); border-radius:16px; padding:10px 14px; border:1px solid var(--line); opacity:0.6;">
      <span style="font-family:'Fredoka',sans-serif; font-weight:600; font-size:14px; color:var(--ink-soft); width:18px;">9</span>
      <div style="width:34px; height:34px; border-radius:50%; background:var(--coral-pale); display:flex; align-items:center; justify-content:center; font-family:'Fredoka',sans-serif; font-weight:600; font-size:13px; color:var(--coral-deep);">AL</div>
      <span style="flex:1; font-size:14px; font-weight:700;">Alex</span>
      <span style="font-size:13px; color:var(--ink-soft); font-weight:700;">210 XP</span>
    </div>
  </div>

  <!-- promotion note -->
  <div class="row" style="flex:none; gap:8px; margin: 12px 24px 24px; background:var(--green-pale); border-radius:14px; padding:12px 14px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 19V5M5 12l7-7 7 7" stroke="var(--green-deep)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span style="font-size:12.5px; font-weight:700; color:var(--green-deep);">Top 5 promote to Emerald League</span>
  </div>

</div>
</x-dc>
</body>
</html>
